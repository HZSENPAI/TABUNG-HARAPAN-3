<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="jarBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <linearGradient id="goldCoinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#881337" flood-opacity="0.3" />
    </filter>
    <filter id="coinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#d97706" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- App Background Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#roseGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- Main Tabung Duit Container (Clean Cylindrical / Jar Safe) -->
  <g filter="url(#shadow)">
    <!-- Base Pedestal of Tabung -->
    <ellipse cx="256" cy="370" rx="135" ry="32" fill="#fda4af" />
    <rect x="121" y="348" width="270" height="24" rx="12" fill="#f43f5e" opacity="0.3" />

    <!-- Jar Body -->
    <path d="M 125,230 L 125,350 C 125,385 387,385 387,350 L 387,230 Z" fill="url(#jarBodyGrad)" stroke="#fda4af" stroke-width="3" />
    
    <!-- Glass Highlight Reflection -->
    <path d="M 140,240 L 140,340 C 140,358 190,364 210,364 L 210,240 Z" fill="url(#accentGlass)" />

    <!-- Lid Neck & Rim -->
    <ellipse cx="256" cy="228" rx="131" ry="26" fill="#fecdd3" stroke="#f43f5e" stroke-width="2" />
    <path d="M 145,200 L 145,225 C 145,242 367,242 367,225 L 367,200 Z" fill="#ffffff" />
    
    <!-- Lid Top Dome with Coin Slot -->
    <ellipse cx="256" cy="200" rx="120" ry="24" fill="#fb7185" stroke="#ffffff" stroke-width="4" />
    <ellipse cx="256" cy="198" rx="112" ry="20" fill="#e11d48" />

    <!-- Coin Slot on Lid -->
    <ellipse cx="256" cy="198" rx="42" ry="8" fill="#4c0519" />

    <!-- Golden Coin Dropping into Slot -->
    <g filter="url(#coinGlow)">
      <ellipse cx="256" cy="130" rx="46" ry="46" fill="url(#goldCoinGrad)" stroke="#fef08a" stroke-width="4" />
      <ellipse cx="256" cy="130" rx="38" ry="38" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="4 2" />
      <text x="256" y="142" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#78350f" text-anchor="middle">RM</text>
    </g>

    <!-- Front Badge Label "TABUNG HARAPAN" on the Jar -->
    <rect x="175" y="275" width="162" height="48" rx="14" fill="#ffffff" stroke="#f43f5e" stroke-width="2" />
    <text x="256" y="296" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#e11d48" text-anchor="middle" letter-spacing="1">TABUNG</text>
    <text x="256" y="314" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="15" fill="#be123c" text-anchor="middle" letter-spacing="1">HARAPAN</text>

    <!-- Credit card icon accent beside tabung -->
    <g transform="translate(325, 290) rotate(14)">
      <rect width="68" height="42" rx="7" fill="#ffffff" stroke="#f43f5e" stroke-width="2" />
      <rect y="8" width="68" height="9" fill="#e11d48" opacity="0.85" />
      <rect x="8" y="23" width="16" height="10" rx="2" fill="#fbbf24" />
    </g>
  </g>

  <!-- Bottom App Title Banner -->
  <rect x="146" y="426" width="220" height="36" rx="18" fill="#ffffff" fill-opacity="0.95" />
  <text x="256" y="450" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="800" fill="#e11d48" text-anchor="middle" letter-spacing="2">TABUNG HARAPAN</text>
</svg>
